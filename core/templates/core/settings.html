{% extends 'core/layout/profile_base.html' %}

{% block profile_content %}
<div class="row mt-3">
    <div class="col">
        <form action="" method="post" class="needs-validation mb-3">
            <div class="row">
                <div class="col-md-3">
                    <div class="d-flex flex-column mb-3">
                        <label for="avatar" class="form-label fw-semibold">Фото профиля</label>
                        <img src="" width="128" height="128" class="border rounded-circle mb-2">
                        <input type="file" name="" id="avatar" class="form-control form-control-sm border-2 shadow-sm">
<!--
                        <div class="d-flex flex-column">
                            <small class="text-danger mt-1">Ошибка чтения файла</small>
                            <small class="text-danger mt-1">Размер файла слишком большой</small>
                        </div> -->
                    </div>
                </div>

                <div class="col-md-8 mx-auto">
                    <div class="mb-3">
                        <label for="login" class="form-label fw-semibold">Логин</label>
                        <input type="text" id="login"
                                class="form-control border-2 shadow-sm" value="{{ user.login }}" placeholder="Придумайте логин... (длина: 3 - 32 символа)" required>

                        <!-- <div class="d-flex flex-column">
                            <small class="text-danger mt-1">Заполните поле</small>
                            <small class="text-danger mt-1">Логин слишком короткий</small>
                        </div> -->
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="text" id="email"
                                class="form-control border-2 shadow-sm"
                                value="{{ user.email }}"  placeholder="example@mail.com" required>

                        <!-- <div class="d-flex flex-column">
                            <small class="text-danger mt-1">Заполните поле</small>
                            <small class="text-danger mt-1">Некорректный домен</small>
                            <small class="text-danger mt-1">Данный Email уже зарегистрирован</small>
                        </div> -->
                    </div>

                    <div class="mb-3">
                        <label for="nickname" class="form-label fw-semibold">Никнейм</label>
                        <input type="text" id="nickname"
                                class="form-control border-2 shadow-sm"
                                value="{{ user.nickname }}" placeholder="Придумайте никнейм..." required>
<!--
                        <div class="d-flex flex-column">
                            <small class="text-danger mt-1">Заполните поле</small>
                            <small class="text-danger mt-1">Данный никнейм уже занят</small>
                        </div> -->
                    </div>

                    <div class="d-grid gap-2">
                        <!-- <p class="text-success text-center m-0 p-0">На Вашу почту отправлено письмо с подтверждением</p>
                        <p class="text-danger text-center m-0">Ошибка сохранения. Попробуйте позже</p> -->
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-3">
                            Сохранить
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
