{% extends 'base.html' %}

{% block content %}
<div class="container py-4 mx-auto my-auto" style="max-width: {% block form_width %}{% endblock %};">
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-3 p-md-5">

            <h3 class="fw-bold mb-4 text-center">{% block auth_title %}{% endblock %}</h3>

            <form action="" method="post" class="needs-validation">
                {% block form_content %}
                {% endblock %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
