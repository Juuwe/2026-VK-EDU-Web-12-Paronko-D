<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>

    <link rel="icon" href="/public/static/img/favicon-32.png" type="image/png">

    <link rel="stylesheet" href="/public/static/css/style.css">
    <link rel="stylesheet" href="/public/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/static/css/bootstrap-icons.css">
</head>

<body>
<div class="container-fluid p-0 d-flex flex-column vh-100">
    <header class="shadow-sm py-2">
        <div class="container-fluid">
            <div class="row align-items-center g-2">

            <div class="col-auto me-auto">
                <a href="index.html" class="logo text-nowrap text-decoration-none">try {</a>
            </div>

            


            <div class="col-auto ms-auto order-2 order-md-3">
                
                    <div class="d-flex gap-2">
                        <a href="login.html" class="btn btn-outline-primary btn-sm px-3 rounded-3">
                            Войти
                        </a>

                        <a href="signup.html" class="btn btn-primary btn-sm px-3 rounded-3">
                            Регистрация
                        </a>
                    </div>
                
            </div>
        </div>
    </header>

    <div class="row g-0 flex-grow-1">
        <div class="col d-flex flex-column">

            <main class="flex-grow-1 d-flex flex-column">
                <div class="container-fluid bg-white flex-grow-1 d-flex flex-column p-0">
                    
<div class="container py-2 mx-auto my-auto" style="max-width: 500px;">
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-3 p-md-5">

            <h3 class="fw-bold mb-4 text-center">Вход</h3>

            <form action="" method="post" class="needs-validation">

                <div class="mb-3">
                    <label for="login" class="form-label fw-semibold">Логин или Email</label>
                    <input type="text" id="login"
                            class="form-control border-2 shadow-sm"
                            placeholder="Логин / Email..." required>

                    <small class="text-danger mt-1">Заполните поле</small>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Пароль</label>

                    <input type="password" id="password"
                        class="form-control border-2 shadow-sm border-end-0"
                        placeholder="Пароль..." required>

                    <small class="text-danger mt-1">Заполните поле</small>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Запомнить меня</label>
                </div>


                <div class="d-grid gap-2">
                    <small class="text-danger text-center mt-1 mb-0"> Неверный логин или пароль </small>
                    <small class="text-danger text-center mt-1"> Ошибка входа. Попробуйте позже </small>
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-3 flex-grow-1">
                        Войти
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <p class="small text-muted mb-0">
                        Забыли пароль? <a href="signup.html" class="text-decoration-none">Восстановить</a>
                    </p>
                </div>

                <div class="mt-2 text-center">
                    <p class="small text-muted mb-0">
                        Нет аккаунта? <a href="signup.html" class="text-decoration-none">Регистрация</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>

                </div>
            </main>

        </div>

        

    </div>

    <div class="row g-0 flex-shrink-0">
        <footer class="py-4 bg-black">
            <div class="container text-center text-secondary small">
                Footer
            </div>
        </footer>
    </div>
</div>
</body>
</html>
