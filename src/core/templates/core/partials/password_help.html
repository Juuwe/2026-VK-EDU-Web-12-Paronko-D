<div class="password-requirements mt-2">
    <ul class="list-unstyled mb-0">
        {% for help_text in field.field.validators %}
            {% if help_text.get_help_text %}
                <li class="text-muted small d-flex align-items-start gap-2 mb-1">
                    <span class="text-primary">•</span>
                    <span>{{ help_text.get_help_text }}</span>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
