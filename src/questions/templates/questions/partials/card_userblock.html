{% load static %}

<div class="col-auto">

    {% if author.avatar %}
        <img src="{{ author.avatar.url }}" alt="Avatar" width="32" height="32" class="rounded-circle border">
    {% else %}
        <img src="{{ STATIC_URL }}img/avatar-default.svg" alt="Default Avatar" width="32" height="32" class="rounded-circle border">
    {% endif %}

    <p class="small mb-0">{{ author.nickname }}</p>
</div>
