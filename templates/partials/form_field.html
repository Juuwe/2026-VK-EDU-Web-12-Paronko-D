<div class="mb-2">
    {% if label %}
        <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ label }}</label>
    {% endif %}

    {{ field }}

    {% if field.errors %}
        <div class="invalid-feedback d-block">
            {% for error in field.errors %}
                {{ error }}
            {% endfor %}
        </div>
    {% endif %}
</div>
