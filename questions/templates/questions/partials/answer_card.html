{% load static %}

<div class="card shadow-sm">
    <div class="card-body">
        <div class="row mb-2">

            {% include 'questions/partials/card_userblock.html' with author_nickname=answer.author.nickname %}

            <div class="col">
                <p class="mb-0">{{ answer.content }}</p>
            </div>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
            {% include 'questions/partials/like_widget.html' with likes=answer.rating %}

            <div class="form-check">
                <input class="form-check-input" {% if answer.checkbox_value %}checked{% endif %} type="checkbox" id="check">
                <label class="form-check-label small" for="check">Правильный!</label>
            </div>

            <small class="text-muted ms-auto">{{ answer.created_at }}</small>
        </div>
    </div>
</div>
