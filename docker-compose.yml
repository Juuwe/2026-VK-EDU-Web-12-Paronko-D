services:
  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    container_name: web_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - ENV_FILE=.env.docker
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  django_media:
  postgres_data:
