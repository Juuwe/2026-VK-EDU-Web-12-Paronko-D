services:
  x-django-base: &django-base
    build: .
    env_file:
    - .env.docker
    volumes:
    - ./src:/app                        src
    - ./data/static:/data/static
    - ./data/uploads:/data/uploads
    networks:
    - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    <<: *django-base
    container_name: web_app
    command: gunicorn -c gunicorn.conf.py application.wsgi:application
    ports:
      - "8000:8000"

  wsgi_test:
    <<: *django-base
    container_name: wsgi_hw_test
    command: gunicorn -b 0.0.0.0:8081 test_wsgi:application
    ports:
      - "8081:8081"

  celery:
    <<: *django-base
    container_name: celery_worker
    command: celery -A application worker -l INFO

  celery-beat:
    <<: *django-base
    container_name: celery_beat
    command: sh -c "rm -f ./celerybeat.pid && celery -A application beat -l INFO"

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: centrifugo_server
    volumes:
      - ./centrifugo:/centrifugo
    env_file:
      - .env.docker
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8001:8000"
    networks:
      - app_network

  maildev:
    image: maildev/maildev
    container_name: maildev_smtp
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_front
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/static:/data/static:ro
      - ./data/uploads:/data/uploads:ro
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
