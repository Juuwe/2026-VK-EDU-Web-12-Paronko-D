upstream backend {
    server web:8000;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=django_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/jpeg image/png;
    gzip_min_length 256;

    location /uploads/ {
        alias /data/uploads/;
        expires 7d;
    }

    location /static/ {
        alias /data/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache django_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;

        add_header X-Cache-Status $upstream_cache_status;
    }
}
